  - {name: figure7_supp_g0.05_2024, dir: replication_of_supplementary_material, script: figure7_supp_computation, env: {PRIOR_IDX: "1", VEND: "202412"}, sheet: figure7_supp, dst_rows: [1], src_cols: [1, 2, 3], dst_cols: [1, 3, 5]}
