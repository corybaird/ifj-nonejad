  - {name: figure6_supp_a, dir: replication_of_supplementary_material, script: figure6_supp_computation, env: {DA0: "0.10", DB0: "0.10"}, sheet: figure6_supp, src_cols: [1, 2], dst_cols: [1, 2]}
