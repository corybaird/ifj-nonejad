  - {name: figure4, dir: replication_of_submission, script: figure4, output: figure4_reproduced.png}
  - {name: figure5, dir: replication_of_submission, script: figure5, output: figure5_reproduced.png}
  - {name: figure7, dir: replication_of_submission, script: figure7, output: figure7_reproduced.png}
  - {name: figure8_supp, dir: replication_of_supplementary_material, script: figure8_supp, output: figure8_supp_reproduced.png}
